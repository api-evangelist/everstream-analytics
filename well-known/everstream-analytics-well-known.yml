notes: 'Everstream Analytics publishes no /.well-known/ discovery surface on its marketing
  site (www.everstream.ai), its application hosts (us1/eu1.apps.everstream.ai) or its
  integration host (int.us1.apps.everstream.ai). The only /.well-known/ documents served
  anywhere on the everstream.ai estate belong to m365-mcp.everstream.ai, a Microsoft
  365 MCP relay (RFC 9728 protected-resource metadata + RFC 8414 authorization-server
  metadata). Those documents are real and are recorded verbatim below, but they describe
  Microsoft Graph scopes for an internal productivity tool — they are NOT metadata for
  the Everstream supply chain platform API. portal.everstream.ai is a Pylon single-page
  app that answers HTTP 200 with an HTML shell for every path, including every
  /.well-known/* path; all of its responses are recorded as false positives and rejected.'
