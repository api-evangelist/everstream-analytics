aid: everstream-analytics
name: Everstream Analytics
description: 'Everstream Analytics is a supply chain risk analytics and intelligence
  company whose platform — grown out of DHL''s innovation labs — continuously monitors
  global supply networks and scores risk across suppliers, sites, materials, lanes
  and shipments. The platform spans global monitoring and alerting, risk assessment
  and scoring, sub-tier and n-tier network mapping, applied meteorology and weather
  intelligence, and regulatory/ESG compliance screening (LkSG, CSDDD, UFLPA, CTPAT).
  Risk intelligence is delivered into customer systems through an Insights-to-Action
  integration layer offering API connectivity with bidirectional flows, event-driven
  webhooks, and SFTP batch transfer, with named connectors into SAP Integrated Business
  Planning, SAP Business Network for Logistics, Oracle TMS, Kinaxis and other planning,
  sourcing and visibility systems. The API surface (marketed as the Reveal API and
  Explore API) is documented for customers behind authentication; no public OpenAPI,
  developer portal or SDK has been published as of this profile.'
