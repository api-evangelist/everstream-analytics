  name: Everstream Analytics Platform API
  description: 'The Everstream Analytics platform API surface (marketed as the Reveal
    API for real-time incident risk on entities, locations and lanes, and the Explore
    API for long-range planning data). It powers the Insights-to-Action integration
    layer that pushes supply chain risk intelligence into customer planning, procurement,
    ERP, TMS and visibility systems. Access is contractual: the reference documentation
    lives behind customer authentication in the Everstream knowledge base and customer
    portal, and no public OpenAPI, Swagger, GraphQL or MCP contract is published.'
