notes: 'Everstream Analytics does NOT publish an MCP server over its supply chain risk data. No MCP endpoint,
  no agent tooling, and no agent documentation exists for the Reveal or Explore API.

  A real, publicly reachable MCP server does run on the everstream.ai estate at m365-mcp.everstream.ai
  — but it is a Microsoft 365 MCP relay (the root page returns the plain-text banner "Microsoft 365 MCP
  Server is running", and its protected-resource metadata advertises Microsoft Graph scopes: Mail.*, Calendars.*,
  Files.*, Chat.*, Team*, Sites.*). It is internal productivity tooling that happens to be internet-facing,
  not an agent interface to any Everstream product.

  It is recorded here so the finding is not lost, but deliberately NOT wired as a `type: MCPServer` pointer
  in apis.yml. The mcp_server_present and agent-readiness mcp_server checks mean "this provider exposes
  its API to agents over MCP"; crediting Everstream for a Microsoft 365 relay would award those points
  for something that is not their API surface.

  No candidate tool list was derived either: deriving one requires an OpenAPI to derive from, and Everstream
  publishes none.'
